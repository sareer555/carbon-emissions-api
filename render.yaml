# Render Blueprint — https://render.com/docs/blueprint-spec
#
# One-click deploy: on render.com, "New +" -> "Blueprint" -> connect this
# repo. Render reads this file and provisions the web service + free
# Postgres database automatically, wires DATABASE_URL between them, and
# seeds the emission factors as part of the first deploy.
#
# Render's free tier has no Shell access, so ADMIN_BOOTSTRAP_TOKEN below is
# auto-generated by Render and used to call POST /v1/admin/keys over HTTP
# (see app/routers/admin.py) to issue your first real API key -- no shell
# needed. Find the generated value in the web service's Environment tab.
#
# RAPIDAPI_PROXY_SECRET is also auto-generated. Copy it into RapidAPI's
# provider dashboard as a custom header RapidAPI will attach to every
# proxied request -- header name `X-RapidAPI-Proxy-Secret`, value = this
# generated secret. That lets RapidAPI subscribers authenticate without a
# cek_ key of ours (see app/auth.py: authenticate()); direct customers with
# a real cek_ key keep working exactly as before.

databases:
  - name: carbon-emissions-db
    plan: free
    databaseName: carbon_emissions
    user: carbon_emissions

services:
  - type: web
    name: carbon-emissions-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m app.seed.seed_db && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: carbon-emissions-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ADMIN_BOOTSTRAP_TOKEN
        generateValue: true
      - key: RAPIDAPI_PROXY_SECRET
        generateValue: true

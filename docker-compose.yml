version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://carbon:carbon@db:5432/carbon
      - ENVIRONMENT=development
    depends_on:
      - db
    command: >
      sh -c "python -m app.seed.seed_db && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./app:/app/app

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=carbon
      - POSTGRES_PASSWORD=carbon
      - POSTGRES_DB=carbon
    ports:
      - "5432:5432"
    volumes:
      - carbon_pg_data:/var/lib/postgresql/data

volumes:
  carbon_pg_data:
